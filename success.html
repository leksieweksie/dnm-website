<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You — DNM Drugs No More</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900&family=Roboto:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/tailwind.css" />
  <link rel="stylesheet" href="assets/site.css" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{scroll-behavior:smooth;}
    body{font-family:'Roboto',sans-serif;color:#102418;background:#E8F5EC;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;}
    .card{background:#fff;border-radius:20px;box-shadow:0 8px 40px rgba(15,46,26,0.12),0 0 0 1px rgba(15,46,26,0.04);padding:3rem;max-width:480px;width:100%;text-align:center;}
    .check{width:72px;height:72px;background:#1F6B3A;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;}
    .btn{display:inline-flex;align-items:center;gap:0.5rem;padding:0.8rem 1.8rem;border-radius:8px;font-weight:600;font-size:0.9rem;letter-spacing:0.04em;text-transform:uppercase;text-decoration:none;transition:background 0.2s ease,transform 0.15s ease;}
    .btn-primary{background:#1F6B3A;color:#fff;}
    .btn-primary:hover{background:#3FAE5A;color:#0F2E1A;transform:translateY(-2px);}
    .btn-outline{background:transparent;color:#1F6B3A;border:2px solid #1F6B3A;}
    .btn-outline:hover{background:#E8F5EC;transform:translateY(-2px);}
  </style>
</head>
<body>
  <div class="card">
    <div class="check">
      <svg width="36" height="36" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <h1 id="title" style="font-family:'Playfair Display',serif;font-weight:900;font-size:2rem;color:#0F2E1A;letter-spacing:-0.02em;margin-bottom:0.75rem;">Payment Confirmed</h1>
    <p id="subtitle" style="color:#4a6b55;line-height:1.7;margin-bottom:0.5rem;"></p>
    <p style="color:#A7B3AA;font-size:0.85rem;margin-bottom:2rem;">A confirmation email has been sent to you. If you have any questions, contact us at <a href="mailto:info@drugsnomore.org" style="color:#1F6B3A;">info@drugsnomore.org</a>.</p>
    <div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;">
      <a href="index.html" class="btn btn-primary">Back to Home</a>
      <a href="products.html" class="btn btn-outline" id="shopLink">Visit Shop</a>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const type = params.get('type');
    const amount = params.get('amount');
    const name = params.get('name');

    if (type === 'donation') {
      document.getElementById('title').textContent = 'Thank You for Donating!';
      document.getElementById('subtitle').textContent = `Your donation${amount ? ' of ฿' + amount : ''} goes directly to DNM's drug prevention programs in Phuket.${name ? ' Thank you, ' + name + '.' : ''}`;
      document.getElementById('shopLink').style.display = 'none';
    } else {
      document.getElementById('subtitle').textContent = `Your order${amount ? ' totalling ฿' + amount : ''} has been confirmed. We'll be in touch with fulfilment details.${name ? ' Thanks, ' + name + '!' : ''}`;
    }
  </script>
</body>
</html>
